name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate design tokens (drift check)
        run: |
          pnpm run tokens:build
          git diff --exit-code src/styles/tokens.generated.css
      - name: Check CSS variable references
        run: pnpm run tokens:check
      - name: Install design-system deps (no lifecycle scripts)
        run: npm ci --ignore-scripts --prefix design-system
      - name: Design-system tests
        working-directory: design-system
        run: npx --no-install jest
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
